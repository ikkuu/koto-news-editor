<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>佐々木's To-Do</title>

<!-- iOS ホーム画面用 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-Do">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%23faf6ec'/><text x='90' y='118' font-size='100' text-anchor='middle' font-family='-apple-system,sans-serif' font-weight='700' fill='%23c2410c'>✓</text></svg>">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%23faf6ec'/><text x='90' y='118' font-size='100' text-anchor='middle' font-family='-apple-system,sans-serif' font-weight='700' fill='%23c2410c'>✓</text></svg>">

<style>
:root {
  --bg: #faf6ec;
  --surface: #ffffff;
  --ink: #2a1f15;
  --ink-2: #5a4838;
  --muted: #998a76;
  --line: #e6e1d3;
  --accent: #c2410c;
  --done: #c0b8a8;
  --doc: #6a8e5a;
  --oca: #4a6fa5;
  --jfc: #c2410c;
  --ws: #b08560;
  --koto: #5a2a8a;
  --misc: #888;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 640px;
  margin: 0 auto;
  padding: env(safe-area-inset-top, 16px) 18px env(safe-area-inset-bottom, 32px);
}
header {
  padding: 16px 0 12px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 18px;
}
.title { font-size: 22px; font-weight: 800; letter-spacing: 0.02em; }
.subtitle { font-size: 11px; color: var(--muted); letter-spacing: 0.15em; margin-top: 4px; text-transform: uppercase; }
.updated { font-size: 11px; color: var(--muted); margin-top: 8px; }

section { margin-bottom: 22px; }
h2 {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 10px;
  padding: 4px 10px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 4px;
  letter-spacing: 0.05em;
}
h2 .count { font-size: 11px; color: rgba(250,246,236,0.7); margin-left: auto; }

ul.todo { list-style: none; padding: 0; margin: 0; }
ul.todo li {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
  line-height: 1.55;
  cursor: pointer;
}
ul.todo li:last-child { border-bottom: none; }
ul.todo li .check {
  flex: 0 0 22px;
  width: 22px; height: 22px;
  border: 2px solid var(--muted);
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
  transition: all 0.15s;
}
ul.todo li.done .check {
  background: var(--ink);
  border-color: var(--ink);
}
ul.todo li.done .check::after {
  content: "✓";
  color: var(--bg);
  font-size: 14px;
  font-weight: 800;
}
ul.todo li.done .body { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
.body { flex: 1; }
.tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 1px 6px;
  border-radius: 3px;
  margin-right: 6px;
  vertical-align: middle;
  color: #fff;
}
.tag.doc { background: var(--doc); }
.tag.oca { background: var(--oca); }
.tag.jfc { background: var(--jfc); }
.tag.ws { background: var(--ws); }
.tag.koto { background: var(--koto); }
.tag.misc { background: var(--misc); }
.note { font-size: 12px; color: var(--muted); margin-top: 3px; }

.loading { padding: 24px 0; text-align: center; color: var(--muted); }

footer {
  padding: 24px 0 0;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  letter-spacing: 0.05em;
}
footer .reset {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 12px;
  border: 1px solid var(--muted);
  border-radius: 12px;
  color: var(--muted);
  cursor: pointer;
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title">佐々木's To-Do</div>
    <div class="subtitle">tap to check / hold to keep</div>
    <div class="updated" id="updated">読み込み中...</div>
  </header>

  <div id="sections">
    <div class="loading">読み込み中...</div>
  </div>

  <footer>
    <div>✓ をタップで完了。状態はこの端末に保存されます。</div>
    <span class="reset" id="reset-btn">↻ チェックをすべて解除</span>
  </footer>
</div>

<script>
const KEY = "todo-checked-v2";

function loadChecked() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (_) { return {}; }
}
function saveChecked(state) {
  localStorage.setItem(KEY, JSON.stringify(state));
}

let checkedState = loadChecked();

function render(data) {
  document.getElementById('updated').textContent = `最終更新: ${data.updated}`;

  const container = document.getElementById('sections');
  container.innerHTML = '';

  data.sections.forEach(section => {
    const sec = document.createElement('section');
    sec.dataset.sectionId = section.id;

    const total = section.items.length;
    const done = section.items.filter(it => checkedState[it.id]).length;

    sec.innerHTML = `<h2>${escapeHtml(section.title)} <span class="count">${done}/${total}</span></h2>`;

    const ul = document.createElement('ul');
    ul.className = 'todo';
    section.items.forEach(item => {
      const li = document.createElement('li');
      li.dataset.itemId = item.id;
      if (checkedState[item.id]) li.classList.add('done');

      const tag = data.tagLabels[item.tag] || item.tag;
      const tagClass = item.tag || 'misc';
      const noteHtml = item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : '';
      li.innerHTML = `
        <span class="check"></span>
        <div class="body"><span class="tag ${tagClass}">${escapeHtml(tag)}</span>${escapeHtml(item.text)}${noteHtml}</div>
      `;
      li.addEventListener('click', () => {
        if (checkedState[item.id]) delete checkedState[item.id];
        else checkedState[item.id] = Date.now();
        saveChecked(checkedState);
        li.classList.toggle('done');
        updateCount(sec, section);
      });
      ul.appendChild(li);
    });

    sec.appendChild(ul);
    container.appendChild(sec);
  });
}

function updateCount(sectionEl, section) {
  const done = section.items.filter(it => checkedState[it.id]).length;
  const total = section.items.length;
  sectionEl.querySelector('.count').textContent = `${done}/${total}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("すべてのチェックを解除します。よろしいですか？")) {
    localStorage.removeItem(KEY);
    checkedState = {};
    document.querySelectorAll('ul.todo li').forEach(li => li.classList.remove('done'));
    document.querySelectorAll('section').forEach(sec => {
      const id = sec.dataset.sectionId;
      const total = sec.querySelectorAll('li').length;
      sec.querySelector('.count').textContent = `0/${total}`;
    });
  }
});

// データを読み込み
fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => render(data))
  .catch(err => {
    document.getElementById('sections').innerHTML =
      `<div class="loading">読み込み失敗: ${err.message}</div>`;
  });
</script>
</body>
</html>
